<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Maritime Theme – Live Preview</title>

<link rel="stylesheet" href="css/root.css">

<style>
/* =========================================================
   Grundlayout
   ========================================================= */
body {
    background: var(--color-bg);
    padding: var(--space-xl);
    font-family: var(--font-base);
    color: var(--color-text);
    line-height: var(--line-height);
}

.section {
    margin-bottom: var(--space-xxl);
}

/* Überschriften */
h1, h2 {
    font-family: var(--font-serif);
    margin-bottom: var(--space-l);
    color: var(--color-ocean-dark);
}

/* =========================================================
   Farb-Grid
   ========================================================= */

.color-grid {
    display: grid;
    gap: var(--space-m);
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
}

/* FARBFELDER */
.color-box {
    min-height: 110px;
    border-radius: var(--radius-m);
    padding: var(--space-m);
    box-shadow: var(--shadow-s);
    border: 1px solid rgba(0,0,0,0.12);
    background: rgba(255,255,255,0.35);

    display: flex;
    flex-direction: column;
    justify-content: center;
}

/* Label für Variablennamen */
.color-box strong {
    font-family: var(--font-serif);
    font-size: var(--font-size-m);
    margin-bottom: var(--space-xs);
    display: block;
    color: var(--color-text);
}

/* Beschreibungstext */
.color-box span {
    font-size: var(--font-size-s);
    color: var(--color-text-muted);
}

/* Extra: Bessere Kontur bei dunklen Hintergründen */
.color-box[style*="color:white"] strong,
.color-box[style*="color:white"] span {
    color: rgba(255,255,255,0.95);
}
</style>

</head>
<body>

<h1>Maritime Theme – Live Preview</h1>

<div class="section">
    <h2>Farben</h2>

    <div class="color-grid">

        <div class="color-box" style="background: var(--color-bg);">
            <strong>--color-bg</strong>
            <span>Hintergrund</span>
        </div>

        <div class="color-box" style="background: var(--color-bg-secondary);">
            <strong>--color-bg-secondary</strong>
            <span>Zweit-Hintergrund</span>
        </div>

        <div class="color-box" style="background: var(--color-ocean); color:white;">
            <strong>--color-ocean</strong>
            <span>Ozean</span>
        </div>

        <div class="color-box" style="background: var(--color-ocean-light);">
            <strong>--color-ocean-light</strong>
            <span>Ozean hell</span>
        </div>

        <div class="color-box" style="background: var(--color-ocean-dark); color:white;">
            <strong>--color-ocean-dark</strong>
            <span>Ozean dunkel</span>
        </div>

        <div class="color-box" style="background: var(--color-wood); color:white;">
            <strong>--color-wood</strong>
            <span>Holz</span>
        </div>

        <div class="color-box" style="background: var(--color-brass);">
            <strong>--color-brass</strong>
            <span>Messing</span>
        </div>

        <div class="color-box" style="background: var(--color-success-bg);">
            <strong>--color-success-bg</strong>
            <span>Erfolg</span>
        </div>

        <div class="color-box" style="background: var(--color-error-bg);">
            <strong>--color-error-bg</strong>
            <span>Fehler</span>
        </div>

    </div>
</div>

</body>
</html>
