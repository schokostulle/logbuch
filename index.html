<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Community Webapp – Login</title>

<!-- Global Design Tokens -->
<link rel="stylesheet" href="css/root.css">

<!-- Spezielles Layout für Startseite -->
<link rel="stylesheet" href="css/index.css">

</head>
<body>

<div class="auth-wrapper">

    <!-- Branding / Kopfbereich -->
    <header class="auth-header">
        <h1>Community Webapp</h1>
        <p class="subtitle">Login & Registrierung</p>
    </header>


    <!-- Login-Formular -->
    <section class="auth-section" id="login-section">
        <h2>Login</h2>

        <form id="login-form">

            <label for="login-username">Benutzername</label>
            <input type="text" id="login-username" name="username" required>

            <label for="login-password">Passwort</label>
            <input type="password" id="login-password" name="password" required>

            <button type="submit" class="btn btn-primary">Login</button>
        </form>

        <p class="switch">
            Noch keinen Account?
            <a href="#" id="show-register">Jetzt registrieren</a>
        </p>
    </section>



    <!-- Registrierung-Formular -->
    <section class="auth-section hidden" id="register-section">
        <h2>Registrierung</h2>

        <form id="register-form">

            <label for="reg-username">Benutzername</label>
            <input type="text" id="reg-username" name="username" required>

            <label for="reg-password">Passwort</label>
            <input type="password" id="reg-password" name="password" required>

            <button type="submit" class="btn btn-secondary">Registrieren</button>
        </form>

        <p class="switch">
            Bereits registriert?
            <a href="#" id="show-login">Zum Login</a>
        </p>
    </section>



    <!-- Statusausgabe -->
    <div id="auth-status" class="status-box"></div>

</div>


<!-- JS -->
<script type="module" src="js/supabase.js"></script>
<script type="module" src="js/auth.js"></script>
<script type="module" src="js/index.js"></script>

</body>
</html>
