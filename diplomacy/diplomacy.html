<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Diplomatie – Logbuch</title>

    <!-- Design Tokens + Global Layout -->
    <link rel="stylesheet" href="../css/root.css">
    <link rel="stylesheet" href="../css/style.css">

    <!-- Schriftarten (Projektstandard) -->
    <link href="https://fonts.googleapis.com/css2?family=Estonia&family=Almendra+SC&family=Cormorant+Garamond:wght@400;600&family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Tool-spezifisches CSS -->
    <link rel="stylesheet" href="diplomacy.css">
</head>

<body>

<div class="layout-container">

    <!-- Navigation -->
    <nav id="nav-container"></nav>

    <!-- Hauptbereich -->
    <main class="content-area">

        <!-- Kopf -->
        <header id="kopf-container"></header>

        <!-- TOOL: DIPLOMACY -->
        <section class="tool-content">

            <div class="diplomacy-wrapper">

                <!-- RESET -->
                <div class="diplomacy-reset">
                    <button class="save-btn" id="reset-diplomacy">
                        Alle Status zurücksetzen
                    </button>
                </div>

                <!-- ================= ALLIANZEN ================= -->
                <section class="diplomacy-section">

                    <h2 class="diplomacy-title">Allianz-Diplomatie</h2>

                    <div id="diplomacy-alliance-status"></div>

                    <div class="diplomacy-table-wrapper">
                        <table class="member-table diplomacy-table">

                            <thead>
                                <tr>
                                    <th>Allianzkürzel</th>
                                    <th>Status</th>
                                    <th>Aktion</th>
                                </tr>
                            </thead>

                            <tbody id="alliance-table-body">
                                <!-- diplomacy.js -->
                            </tbody>

                        </table>
                    </div>

                </section>

                <!-- ================= SPIELER ================= -->
                <section class="diplomacy-section">

                    <h2 class="diplomacy-title">Spieler-Diplomatie</h2>

                    <div id="diplomacy-player-status"></div>

                    <div class="diplomacy-table-wrapper">
                        <table class="member-table diplomacy-table">

                            <thead>
                                <tr>
                                    <th>Spielername</th>
                                    <th>Status</th>
                                    <th>Aktion</th>
                                </tr>
                            </thead>

                            <tbody id="player-table-body">
                                <!-- diplomacy.js -->
                            </tbody>

                        </table>
                    </div>

                </section>

            </div>

        </section>

    </main>

</div>

<!-- Globale Module -->
<script type="module" src="../js/supabase.js"></script>
<script type="module" src="../js/auth.js"></script>
<script type="module" src="../js/navigation.js"></script>
<script type="module" src="../js/kopf.js"></script>

<!-- Tool-Logik -->
<script type="module" src="diplomacy.js"></script>

</body>
</html>
