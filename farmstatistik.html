<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logbuch – Farmstatistik</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="loginBox">
  <h1>Logbuch</h1>
  <input type="password" id="password" placeholder="Passwort" autocomplete="current-password">
  <button id="loginBtn" style="width:100%;">Anmelden</button>
  <div id="loginError"></div>
</div>

<div id="app">
  <div id="navbar" class="navbar"></div>
  <h1>Farmstatistik</h1>
  <div id="meta">Lade Daten…</div>
  <button id="refresh">Aktualisieren</button>
  <button id="logout">Abmelden</button>

  <div class="tablewrap">
  <table id="dataTable">
    <thead>
      <tr>
        <th data-key="oz">Oz</th>
        <th data-key="ig">IG</th>
        <th data-key="i">I</th>
        <th data-key="distance">Entfernung</th>
        <th data-key="fahrzeit_minuten">Fahrzeit</th>
        <th>Rückkehr</th>
        <th data-key="nearest_village">Von</th>
        <th data-key="est_gold">Gold</th>
        <th data-key="est_steine">Stein</th>
        <th data-key="est_holz">Holz</th>
        <th data-key="farmable_sum">Plünderbar</th>
        <th data-key="kogg_empfehlung">Kogg</th>
        <th data-key="status">Status</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  </div>
</div>

<!-- Reihenfolge wichtig: config vor auth vor nav vor Modul, Auth.init() zuletzt -->
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="nav.js"></script>
<script src="farmstatistik.js"></script>
<script>Auth.init();</script>

</body>
</html>
