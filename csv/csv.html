<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSV – Logbuch</title>

    <!-- Design Tokens + Global Layout -->
    <link rel="stylesheet" href="../css/root.css">
    <link rel="stylesheet" href="../css/style.css">

    <!-- Maritime Schriftarten -->
    <link href="https://fonts.googleapis.com/css2?family=Estonia&family=Almendra+SC&family=Cormorant+Garamond:wght@400;600&family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Tool-spezifisches CSS -->
    <link rel="stylesheet" href="csv.css">
</head>

<body>

<div class="layout-container">

    <!-- Navigation -->
    <nav id="nav-container"></nav>

    <!-- Hauptbereich -->
    <main class="content-area">

        <!-- Kopfzeile -->
        <header id="kopf-container"></header>

        <!-- Tool-Inhalt -->
        <section class="csv-wrapper">

            <h2>CSV Import</h2>

            <div class="csv-controls">
                <input type="file" id="csv-file" accept=".csv">

                <button class="csv-btn" id="upload-btn">
                    CSV hochladen
                </button>

                <button class="csv-btn" id="delete-btn">
                    Alle Daten löschen
                </button>
            </div>

            <div id="csv-status"></div>

            <!-- Scrollbarer Tabellenbereich -->
            <div class="csv-table-wrapper">
                <table class="csv-table">
                    <thead>
                        <tr>
                            <th>Oz</th>
                            <th>Ig</th>
                            <th>In</th>
                            <th>Inselname</th>
                            <th>Spieler ID</th>
                            <th>Spielername</th>
                            <th>Allianz ID</th>
                            <th>Allianzkürzel</th>
                            <th>Allianzname</th>
                            <th>Punkte</th>
                        </tr>
                    </thead>

                    <tbody id="csv-table-body">
                        <!-- Wird durch csv.js gefüllt -->
                    </tbody>
                </table>
            </div>

        </section>

    </main>

</div>

<!-- Globale JS-Module -->
<script type="module" src="../js/supabase.js"></script>
<script type="module" src="../js/auth.js"></script>
<script type="module" src="../js/navigation.js"></script>
<script type="module" src="../js/kopf.js"></script>

<!-- Tool-spezifisches Script -->
<script type="module" src="csv.js"></script>

</body>
</html>
