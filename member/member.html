<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mitgliederverwaltung – Logbuch</title>

    <!-- Design Tokens + Global Layout -->
    <link rel="stylesheet" href="../css/root.css">
    <link rel="stylesheet" href="../css/style.css">

    <!-- Tool-spezifisches CSS -->
    <link rel="stylesheet" href="member.css">

    <!-- Maritime Schriftarten (WICHTIG für Kopf & Titel) -->
    <link href="https://fonts.googleapis.com/css2?family=Estonia&family=Almendra+SC&family=Cormorant+Garamond:wght@400;600&family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

<div class="layout-container">

    <!-- Navigation -->
    <nav id="nav-container"></nav>

    <!-- Hauptbereich -->
    <main class="content-area">

        <!-- Kopfzeile -->
        <header id="kopf-container"></header>

        <!-- Toolinhalt -->
        <section id="tool-content" class="tool-content">

            <div class="member-wrapper">

                <h2 class="member-title">Mitgliederverwaltung</h2>

                <!-- Statusmeldung -->
                <div id="member-status"></div>

                <!-- Tabelle -->
                <table class="member-table">

                    <colgroup>
                        <col style="width: 30%;">
                        <col style="width: 25%;">
                        <col style="width: 25%;">
                        <col style="width: 20%;">
                    </colgroup>

                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Rolle</th>
                            <th>Status</th>
                            <th>Aktion</th>
                        </tr>
                    </thead>

                    <tbody id="member-table-body">
                        <!-- Wird durch member.js gefüllt -->
                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>

<!-- JavaScript -->
<script type="module" src="../js/supabase.js"></script>
<script type="module" src="../js/auth.js"></script>
<script type="module" src="../js/navigation.js"></script>
<script type="module" src="../js/kopf.js"></script>
<script type="module" src="member.js"></script>

</body>
</html>
