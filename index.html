<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logbuch – Dashboard</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="loginBox">
  <h1>Logbuch</h1>
  <input type="password" id="password" placeholder="Passwort" autocomplete="current-password">
  <button id="loginBtn" style="width:100%;">Anmelden</button>
  <div id="loginError"></div>
</div>

<div id="app">
  <div id="navbar" class="navbar"></div>
  <h1>Dashboard</h1>
  <p class="small">Wähle ein Modul aus.</p>

  <div class="tile-grid" id="tileGrid"></div>

  <div style="margin-top:20px;">
    <button id="logout">Abmelden</button>
  </div>
</div>

<!-- Reihenfolge wichtig: config vor auth vor nav, Auth.init() zuletzt -->
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="nav.js"></script>
<script>
  // Kacheln aus derselben Modul-Liste wie die Navigation aufbauen,
  // damit ein neues Modul nur an einer Stelle (nav.js) ergänzt werden muss.
  function renderTiles() {
    const grid = document.getElementById('tileGrid');
    grid.innerHTML = Nav.MODULES
      .filter((m) => m.href !== 'index.html')
      .map((m) => `
        <a class="tile" href="${m.href}">
          <h2>${m.label}</h2>
          <p>Öffnen →</p>
        </a>
      `).join('');
  }
  Auth.onReady(renderTiles);
  Auth.init();
</script>

</body>
</html>
