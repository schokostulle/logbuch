<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Maritime Theme – Live Preview</title>

<link rel="stylesheet" href="css/root.css">

<style>
    /* Minimaler Basisstil für die Vorschau */

    body {
        font-family: var(--font-base);
        background: var(--color-bg);
        color: var(--color-text);
        padding: var(--space-xl);
        line-height: var(--line-height);
    }

    h1, h2, h3 {
        font-family: var(--font-serif);
        margin-bottom: var(--space-m);
    }

    .section {
        margin-bottom: var(--space-xxl);
    }

    .color-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: var(--space-m);
    }

    .color-box {
        padding: var(--space-l);
        border-radius: var(--radius-s);
        box-shadow: var(--shadow-s);
        border: 1px solid rgba(0,0,0,0.1);
    }

    .button-row {
        display: flex;
        gap: var(--space-m);
    }

    .btn {
        padding: var(--space-s) var(--space-l);
        border-radius: var(--radius-s);
        border: 1px solid transparent;
        cursor: pointer;
        font-size: var(--font-size-m);
        transition: var(--animation-fast);
        box-shadow: var(--shadow-s);
    }

    .btn:hover { opacity: var(--hover-opacity); }

    .btn-primary {
        background: var(--color-ocean);
        color: white;
    }

    .btn-secondary {
        background: var(--color-brass);
        color: #fff;
    }

    .btn-danger {
        background: var(--color-error);
        color: white;
    }

    .card {
        padding: var(--space-l);
        background: var(--color-bg-secondary);
        border-radius: var(--radius-m);
        box-shadow: var(--shadow-m);
        border-left: 4px solid var(--color-wood);
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: var(--space-m);
        background: var(--color-bg-secondary);
    }

    table th {
        background: var(--color-ocean-dark);
        color: white;
        padding: var(--space-s);
        font-family: var(--font-serif);
        text-align: left;
    }

    table td {
        padding: var(--space-s);
        border-bottom: 1px solid rgba(0,0,0,0.1);
    }

    .nav-sample {
        width: 220px;
        background: var(--color-wood-dark);
        color: white;
        padding: var(--space-l);
        border-radius: var(--radius-m);
        box-shadow: var(--shadow-m);
        font-family: var(--font-serif);
    }

    .nav-sample .item {
        margin-bottom: var(--space-s);
        padding: var(--space-s);
        border-radius: var(--radius-s);
        background: rgba(255,255,255,0.15);
    }

    .header-sample {
        background: var(--color-bg-secondary);
        padding: var(--space-l);
        border-radius: var(--radius-m);
        border-bottom: 4px solid var(--color-brass);
        box-shadow: var(--shadow-s);
    }

</style>

</head>

<body>

<h1>Maritime Theme – Live Preview</h1>

<!-- COLORS -->
<div class="section">
    <h2>Farben</h2>
    <div class="color-grid">

        <div class="color-box" style="background: var(--color-bg);">
            <strong>--color-bg</strong><br>Hintergrund
        </div>

        <div class="color-box" style="background
