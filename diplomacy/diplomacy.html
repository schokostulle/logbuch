<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Diplomatie – Logbuch</title>

    <!-- Design Tokens + Global Layout -->
    <link rel="stylesheet" href="../css/root.css">
    <link rel="stylesheet" href="../css/style.css">

    <!-- Maritime Schriftarten -->
    <link href="https://fonts.googleapis.com/css2?family=Estonia&family=Almendra+SC&family=Cormorant+Garamond:wght@400;600&family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Tool-spezifisches CSS -->
    <link rel="stylesheet" href="diplomacy.css">
</head>

<body>

<div class="layout-container">

    <!-- Navigation -->
    <nav id="nav-container"></nav>

    <!-- Hauptbereich -->
    <main class="content-area">

        <!-- Kopfzeile -->
        <header id="kopf-container"></header>

        <!-- Tool-Inhalt -->
        <section class="tool-content">

            <div class="diplomacy-wrapper">

                <!-- ================= ALLIANZEN ================= -->

                <h2 class="diplomacy-title">Allianzen</h2>

                <table class="member-table">
                    <thead>
                        <tr>
                            <th>Allianz&nbsp;ID</th>
                            <th>Kürzel</th>
                            <th>Status</th>
                            <th>Aktion</th>
                        </tr>
                    </thead>
                    <tbody id="alliance-body">
                        <!-- diplomacy.js -->
                    </tbody>
                </table>

                <!-- ================= SPIELER ================= -->

                <h2 class="diplomacy-title">Spieler</h2>

                <table class="member-table">
                    <thead>
                        <tr>
                            <th>Spieler&nbsp;ID</th>
                            <th>Name</th>
                            <th>Status</th>
                            <th>Aktion</th>
                        </tr>
                    </thead>
                    <tbody id="player-body">
                        <!-- diplomacy.js -->
                    </tbody>
                </table>

            </div>

        </section>

    </main>

</div>

<!-- Globale Module -->
<script type="module" src="../js/supabase.js"></script>
<script type="module" src="../js/auth.js"></script>
<script type="module" src="../js/navigation.js"></script>
<script type="module" src="../js/kopf.js"></script>

<!-- Tool -->
<script type="module" src="diplomacy.js"></script>

</body>
</html>
